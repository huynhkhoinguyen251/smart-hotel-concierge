<html lang="en">

    <meta
      name="description"

    <script>
      // Trang chủ: tải sớm ảnh đầu trang, trước khi JavaScript chạy. Các trang khác không cần ảnh này.
      if (location.pathname === '/') {
        var hero = document.createElement('link');
        hero.rel = 'preload';
        hero.as = 'image';
        hero.href = '/images/hero-my-khe.jpg';
        hero.fetchPriority = 'high';
        document.head.appendChild(hero);
      }
    </script>
